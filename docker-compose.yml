version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: english-word-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 生产环境请务必在 .env 中设置强随机密码，切勿使用默认口令
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-english_word_fission_dev}
    ports:
      # 仅绑定本机回环地址，防止数据库端口暴露到公网网卡
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
